<title>Endgame API</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky command bar (Weapons / Armor / Vault) and, below it, a sticky category bar (ammo tabs + archetype strip)
   that stays pinned while the dense item table scrolls underneath. Translucent panels float over the gold linework
   background. Palette: charcoal + muted gold from the background art; data colors (tiers, ammo, elements, section bands)
   come straight from the Endgame Analysis sheet. Deliberately single-theme dark. */
:root{
  color-scheme: dark;
  --bg:#0c0e10; --panel:rgba(0,0,0,.15); --veil:rgba(0,0,0,.15); --panel-solid:#131518; --panel-2:rgba(30,32,36,.88);
  --line:rgba(201,178,119,.13); --line-2:rgba(201,178,119,.26);
  --fg:#ece8df; --muted:#a59f92; --faint:#706b61;
  --accent:#c9b277; --accent-dim:#655c39;
  --god:#3fdc86; --semi:#f3c64a; --look:#9cc6e4;
  --ammo-primary:#ece8df; --ammo-special:#5ec46a; --ammo-heavy:#a971e6; --ammo-other:#d8b04c; --ammo-all:#e0453a;
  --el-kinetic:#e8e8e8; --el-solar:#ff7f14; --el-arc:#65f3f7; --el-void:#c089d5; --el-stasis:#4f9aff; --el-strand:#00ec6c;
  --t-s:#57bb8a; --t-a:#a7c779; --t-b:#ffd666; --t-c:#f5b06b; --t-d:#e67c73; --t-e:#c27ba0; --t-f:#8e7cc3;
  --sh-weapon:#660000; --sh-info:#783f04; --sh-perks:#274e13; --sh-analysis:#20124d;
  --st-weapons:#f0a35a; --st-health:#6fd38a; --st-class:#78bff0; --st-grenade:#b88cf0; --st-super:#f3d36a; --st-melee:#f07c7c;
  --ink:#0c0e10;
  --hdr:60px;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel-solid)}
#bgart{position:fixed;inset:0;z-index:-1;background:var(--bg) var(--bgimg) center/cover no-repeat}
#bgart::after{content:"";position:absolute;inset:0;background:var(--vignette)}
:root{--vignette:radial-gradient(ellipse at 50% 45%,rgba(12,14,16,.08),rgba(12,14,16,.5) 80%)}
/* sticky bars show the background art itself (85%), so rows scrolling underneath stay hidden */
.artfill{background:linear-gradient(var(--veil),var(--veil)) fixed,var(--vignette) fixed,var(--bg) var(--bgimg) center/cover no-repeat fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;border-bottom:1px solid var(--line-2)}
.topbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:0 26px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;height:60px;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.brand img{width:42px;height:42px;display:block;filter:drop-shadow(0 0 6px rgba(236,232,223,.18))}
.nav{display:flex;align-self:stretch}
.nav button{appearance:none;background:none;border:0;cursor:pointer;position:relative;height:60px;padding:0 18px;
  font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 10px rgba(201,178,119,.6)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.acct-av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--ink);font:700 12px var(--font-body)}
.acct-av:empty{display:none}
.acct.in .acct-l{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:440px){ .acct.in .acct-l{display:none} .acct{padding:0 9px} .icon-btn.acct:not(.in) .acct-l{display:inline} .icon-btn.acct .acct-av:not(:empty){display:grid} }
.snd-ic{display:grid;place-items:center}
#soundBtn .snd-ic{display:grid}
.snd-ic svg{width:16px;height:16px}
#soundBtn.muted{color:var(--faint)}
.vol{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:6px 10px 10px;min-width:250px}
.menu .vol-mute{appearance:none;background:none;border:1px solid var(--line-2);color:var(--fg);width:34px;height:34px;padding:0;border-radius:2px;display:grid;place-items:center;cursor:pointer}
.menu .vol-mute:hover,.menu .vol-mute:focus-visible{border-color:var(--accent);color:var(--accent);background:none}
.vol-mute svg{width:18px;height:18px}
.menu .vol-mute[aria-pressed="true"]{color:var(--faint);background:rgba(255,255,255,.04)}
.vol-pct{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#vol{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,80%),var(--line-2) var(--p,80%));cursor:pointer;margin:0}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);cursor:pointer}
#vol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);cursor:pointer}
#vol:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.info-btn{appearance:none;background:none;border:0;padding:0;margin-left:-2px;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:50%;flex:none}
.info-btn svg{width:20px;height:20px}
.info-btn:hover{color:var(--accent)}
.credit{border:1px solid var(--line-2);background:rgba(201,178,119,.06);padding:14px 16px;display:grid;gap:6px;border-radius:2px}
.credit .sheet{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.credit .by{color:var(--muted)}
.credit .by b{color:var(--accent);font-weight:600}
.credit ul{margin:4px 0 0;padding-left:18px;color:var(--fg);display:grid;gap:3px;font-size:14px}
.fine{font-size:12.5px;color:var(--faint)!important}
/* phone cards */
.cards{display:grid;gap:8px}
.wcard,.acard{border:1px solid var(--line-2);background:var(--veil);border-radius:3px;padding:10px;display:grid;gap:8px}
.wcard.open,.acard.open{background:rgba(201,178,119,.07)}
.wc-top{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px}
.wc-top .thumb{width:44px;height:44px}
.wc-name .nm{display:flex;align-items:center;gap:2px}
.wc-name .nm-txt{min-width:0}
.wc-name .wname{font-size:15px}
.wc-top .tier-cell{flex-direction:column;gap:1px}
.wc-top .expand,.acard .expand{flex:none;width:26px;height:26px}
.wc-info{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.wc-info .ic{width:34px;height:34px}
.wc-info .ic img{width:28px;height:28px}
.wc-info .ic img.stun{width:24px;height:24px}
.wc-info .ic.frame img{width:26px;height:26px}
.wc-src{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;max-width:45%}
.wc-perks{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:6px}
.wc-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:0 4px 3px}
.pcol{display:grid;grid-auto-rows:minmax(30px,auto)}
.pn{display:flex;align-items:center;gap:7px;padding:2px 4px;font-size:13px;line-height:1.2;min-width:0}
.pn + .pn{border-top:1px solid rgba(201,178,119,.16)}
.pn img{width:24px;height:24px;flex:none}
.pn.x{opacity:.45}
.wcard .detail-grid{padding:6px 2px 2px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:10px 16px}
.acard .set{gap:10px}
.acard .set-txt{min-width:0;flex:1}
.acard .set-txt .nm{display:flex;align-items:center;gap:2px}
.acard .bonuses{display:grid;gap:4px;padding-top:6px;border-top:1px solid var(--line)}
.acard .bonus + .bonus{margin-top:0}
.ac-pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.ac-piece{display:grid;justify-items:center;gap:4px}
.ac-piece span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.acard .bonus-cards{grid-template-columns:1fr}
.wcard .dup{display:none}
.maker{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.maker b{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px}
a.btn svg{width:14px;height:14px}
.icon-btn{appearance:none;background:none;border:1px solid var(--line-2);color:var(--muted);height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:2px;font:500 13px var(--font-body)}
.icon-btn:hover{color:var(--fg);border-color:var(--faint)}
.icon-btn svg{width:16px;height:16px}

/* page */
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.count{font-family:var(--font-mono);font-size:12px;color:var(--faint);letter-spacing:0;font-variant-numeric:tabular-nums}

.catbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));z-index:20;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line-2)}
.catbar.flat{margin-top:0}
.ammo-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ammo-tabs::-webkit-scrollbar{display:none}
.ammo-tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--muted);
  font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:12px 14px 10px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.ammo-tab:hover{color:var(--fg)}
.ammo-tab[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--ammo)}
.ammo-swatch{width:8px;height:8px;background:var(--ammo);transform:rotate(45deg);box-shadow:0 0 6px color-mix(in srgb,var(--ammo) 60%,transparent)}
.ammo-tab .count{font-size:11px}
.chips{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-block:10px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);padding-right:28px}
.chips:empty{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer;border-radius:2px;
  font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;display:inline-flex;gap:6px;align-items:baseline;line-height:1.4;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip .count{font-size:10.5px}
.chip[aria-pressed="true"] .count{color:var(--ink);opacity:.6}
.chip.empty{opacity:.4}
.chip-sep{flex:none;width:2px;height:18px;margin-inline:4px;background:var(--ammo);opacity:.8;border-radius:1px}
.fgroup .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:10px 0 6px;width:100%}
.fgroup .sub:first-of-type{margin-top:0}
.subtabs{padding-top:14px}

.controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding-block:6px}
.controls.first{padding-top:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);padding:0 10px;height:36px;flex:1 1 220px;max-width:320px;min-width:0;border-radius:2px}
.search svg{width:15px;height:15px;color:var(--faint);flex:none}
.search input{background:none;border:0;color:var(--fg);font:inherit;outline:none;width:100%;min-width:0}
.search:focus-within{border-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{appearance:none;background:none;border:0;border-right:1px solid var(--line-2);color:var(--muted);font:500 13px var(--font-body);padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.ctl-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.sort-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sort-pill{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:2px}
.sort-pill button{appearance:none;background:none;border:0;color:var(--muted);font:500 13px var(--font-body);padding:6px 10px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.sort-pill button:hover{color:var(--fg)}
.sort-pill.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.sort-pill.on button{color:var(--fg)}
.sort-pill .x{border-left:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:0 8px;color:var(--muted)}
.sort-n{font-family:var(--font-mono);font-size:10.5px;background:var(--accent);color:var(--ink);width:16px;height:16px;display:inline-grid;place-items:center;border-radius:50%}
.sort-dir{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.text-btn{appearance:none;background:none;border:0;color:var(--accent);font:500 13px var(--font-body);cursor:pointer;padding:6px 4px}
.text-btn:hover{text-decoration:underline}

.filters{border:1px solid var(--line);background:var(--panel);margin-block:10px 4px;border-radius:2px}
.filters summary{cursor:pointer;padding:10px 14px;font-family:var(--font-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.filters summary::-webkit-details-marker{display:none}
.filters summary .chev{width:14px;height:14px;color:var(--faint);transition:transform .15s}
.filters[open] summary .chev{transform:rotate(90deg)}
.filters .badge-n{font-family:var(--font-mono);font-size:11px;background:var(--accent);color:var(--ink);padding:1px 7px;border-radius:9px;letter-spacing:0}
.filters .clear{margin-left:auto;letter-spacing:0;text-transform:none;font-family:var(--font-body)}
.fgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 22px;padding:4px 14px 16px}
.fgroup.wide{grid-column:1/-1}
.fgroup h3{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.fvals{display:flex;flex-wrap:wrap;gap:6px}
.fv{appearance:none;background:none;border:1px solid var(--line-2);color:var(--muted);font:500 13px var(--font-body);padding:4px 10px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fv:hover{color:var(--fg)}
.fv[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fv img{width:16px;height:16px}

.result{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--faint);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;padding-block:14px 8px;text-transform:uppercase}

/* tables */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line-2);background:var(--veil);border-radius:2px}
table{width:100%;border-collapse:separate;border-spacing:0}
.wtable{min-width:1180px;table-layout:fixed}
.wtable th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;letter-spacing:.1em}
.wtable th .hs{justify-content:center}
.wtable td{text-align:center}
.wtable .c-name .nm{display:flex;align-items:center;justify-content:center;gap:4px}
.wtable .c-name .nm-txt{min-width:0}
.wtable .expand{flex:none;width:26px;height:26px}
.wtable .tier-cell{justify-content:center}
.wtable .thumb{margin-inline:auto}
.wtable .status-btn{margin-inline:auto}
.wtable td{padding:4px 8px}
.atable td{padding-block:5px}
.wtable th{padding:8px}
.atable{min-width:1000px;table-layout:fixed}
.atable th{text-align:center;white-space:nowrap;letter-spacing:.1em}
.atable td{text-align:center}
.atable .set{justify-content:flex-start;text-align:left;padding-left:6px}
.atable .set-txt{min-width:0}
.atable .set-txt .nm{display:flex;align-items:center;gap:4px}
.atable .expand{flex:none;width:26px;height:26px}
.atable .bonuses{display:grid;text-align:left;justify-items:start;padding-left:14px}
.atable th:nth-child(1),.atable th:nth-child(2){text-align:left;padding-left:20px}
.atable tr.bands th{text-align:center!important;padding-left:8px!important}
tr.bands .b-bonus{background:var(--sh-perks)!important} tr.bands .b-pieces{background:var(--sh-analysis)!important}
th{background:var(--veil)!important;font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-2);background:var(--panel);white-space:nowrap}
th .hs{appearance:none;background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;display:inline-flex;gap:6px;align-items:center}
th .hs:hover{color:var(--fg)}
th .hs.on{color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tr.row:hover td{background:rgba(201,178,119,.05)}
tr.row.open td{background:rgba(201,178,119,.07);border-bottom-color:transparent}
tr.detail td{background:rgba(201,178,119,.07)}
.c-status{width:48px}
.c-thumb{width:66px}
.c-name{min-width:168px}
.c-ico{width:46px;text-align:center}
.c-src{min-width:104px;max-width:150px;font-size:13.5px;line-height:1.25}
.c-perk{width:44px;padding-inline:0!important;text-align:center}
.c-tier{width:78px}
tr.bands th{padding:3px 8px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.16em;color:#fff;text-align:center;border-bottom:0}
tr.bands .b-weapon{background:var(--sh-weapon)!important} tr.bands .b-info{background:var(--sh-info)!important} tr.bands .b-perks{background:var(--sh-perks)!important} tr.bands .b-analysis{background:var(--sh-analysis)!important}
.ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:3px;cursor:default;vertical-align:middle}

<script>
(function(){
"use strict";

/* ================= DATA (from Destiny 2: Endgame Analysis) ================= */
const D = JSON.parse(document.getElementById("vault-data").textContent);
const ICON_SRC = JSON.parse(document.getElementById("vault-icons").textContent);
ICON_SRC.t = JSON.parse(document.getElementById("vault-trait-icons").textContent);
ICON_SRC.e = JSON.parse(document.getElementById("vault-elements").textContent);
document.documentElement.style.setProperty("--bgimg", 'url("__BG__")');
const AMMO = [
  {key:"primary", label:"Primary"},
  {key:"special", label:"Secondary"},
  {key:"heavy",   label:"Heavy"},
  {key:"other",   label:"Other"}
].map(a => ({...a, archs:D.ammo[a.key]}));
const AMMO_TABS = [{key:"all", label:"All Weapons", archs:AMMO.flatMap(a => a.archs)}, ...AMMO];
const AMMO_OF_ARCH = Object.fromEntries(AMMO.flatMap(a => a.archs.map(x => [x, a.key])));
const WEAPONS = D.weapons;
// activities: split combined sources ("Xur, Dares") and tidy spelling variants from the sheet
const ACT_FIX = {"Cosmodrom e":"Cosmodrome","NODE. OVRD. AVALON":"NODE.OVRD. AVALON","Kell's Fall?":"Kell's Fall","?":"Unknown","":"Unknown"};
WEAPONS.forEach(w => { w.acts = [...new Set(w.source.split(",").map(x => x.trim()).map(x => ACT_FIX[x] ?? x))]; });
const ACT_GROUPS = [
  ["Raids", ["Crota's End","Deep Stone Crypt","Desert Perpetual","Epic Desert Perpetual","Garden of Salvation","King's Fall","Last Wish","Root of Nightmares","Salvation's Edge","Vault of Glass","Vow of the Disciple"]],
  ["Dungeons", ["Duality","Ghosts of the Deep","Grasp of Avarice","Pit of Heresy","Prophecy","Shattered Throne","Spire of the Watcher","Sundered Doctrine","Vesper's Host","Warlord's Ruin"]],
  ["PvP", ["Crucible","Competitive","Trials","Iron Banner"]],
  ["Playlists & Ops", ["Arena Ops","Fireteam Ops","Solo Ops","Pinnacle Ops","Onslaught","Gambit","Dares"]],
  ["Vendors", ["Banshee","Xur","Zavala","Shaxx"]],
  ["Destinations", ["World","EDZ","Cosmodrome","Europa","Moon","Nessus","Neomuna","Throne World","Pale Heart","Dreaming City","Kepler"]]
];
const ACT_GROUP_OF = Object.fromEntries(ACT_GROUPS.flatMap(([g, xs]) => xs.map(x => [x, g])));
const ALL_ACTS = [...new Set(WEAPONS.flatMap(w => w.acts))];
function groupActs(acts){
  const out = ACT_GROUPS.map(([g, xs]) => [g, xs.filter(x => acts.includes(x))]);
  out.push(["Seasonal & other", acts.filter(x => !ACT_GROUP_OF[x]).sort((a,b) => a === "Unknown" ? 1 : b === "Unknown" ? -1 : a.localeCompare(b))]);
  return out.filter(([, xs]) => xs.length);
}
const BYID = Object.fromEntries(WEAPONS.map(w => [w.id, w]));
const SETS = D.sets;
const SETBY = Object.fromEntries(SETS.map(s => [s.id, s]));
const NOTES = D.notes;
const STUN = D.stun;
const PIECES = [["head","Head"],["arms","Arms"],["chest","Chest"],["legs","Legs"],["class","Class Item"]];
const STAT_ICON = JSON.parse(document.getElementById("vault-stat-icons").textContent);
const BASE_STATS = [["health","Health"],["melee","Melee"],["grenade","Grenade"],["super","Super"],["class","Class"],["weapons","Weapons"]];
const BASE_NAME = Object.fromEntries(BASE_STATS);
const PAIRS = {health:["grenade","class"],melee:["health","weapons"],grenade:["super","class"],super:["health","melee"],class:["melee","weapons"],weapons:["grenade","super"]};
// each row: one primary stat's two pairings (primary / secondary)
const STATS = BASE_STATS.flatMap(([k,l]) => PAIRS[k].map(t => [k+"-"+t, l+" / "+BASE_NAME[t]]));
const statPrimary = k => k.split("-")[0];
const STATNAME = Object.fromEntries(STATS);
const TIER_ORDER = {S:0,A:1,B:2,C:3,D:4,E:5,F:6};
const tierVar = t => `var(--t-${String(t).toLowerCase()})`;
const SORT_FIELDS = [["name","Name"],["element","Energy"],["frame","Frame"],["source","Source"],["stun","Stun"],["p1","Perk 1"],["p2","Perk 2"],["origin","Origin Trait"],["tier","Tier"]];
const FILTER_FIELDS = [["act","Activity"],["a","Ammo Type"],["element","Energy"],["stun","Stun Type"],["tier","Tier"],["frame","Frame"],["season","Season"]];
const AMMO_LABEL = Object.fromEntries(AMMO.map(a => [a.key, a.label]));
const fieldVals = (w, f) => f === "act" ? w.acts : [w[f]];
const MLABEL = {god:"God Roll",semi:"Semi-God Roll",looking:"Looking for"};
const ammoNum = w => { const s = w.stats[0]; const n = s ? parseFloat(s[1]) : NaN; return isNaN(n) ? -1 : n; };
WEAPONS.forEach(w => { w.ammo = ammoNum(w); });
const SET_TAGS = [...new Set(SETS.flatMap(s => s.bonuses.flatMap(b => b.tags)))].sort();

// decode icons into blob URLs once, on demand
const iconCache = {};
function iconURL(kind, id){
  const key = kind + id;
  if(iconCache[key]) return iconCache[key];
  const src = ICON_SRC[kind][id];
  if(!src) return "";
  try{
    const [head, b64] = src.split(",");
    const mime = head.slice(5, head.indexOf(";"));
    const bin = atob(b64); const u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    iconCache[key] = URL.createObjectURL(new Blob([u8], {type:mime}));
  }catch(e){ iconCache[key] = src; }
  return iconCache[key];
}

/* ================= ICONS ================= */
const I = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  god:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.6 6.4 6.9.5-5.3 4.4 1.7 6.7L12 16.8l-5.9 3.7 1.7-6.7-5.3-4.4 6.9-.5z"/></svg>',
  semi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  looking:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m4.5 12.5 5 5 10-11"/></svg>',
  clear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 5 7 7-7 7"/></svg>'
};
const PIECE_SVG = {
  head:'<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 19c0-7 4-12 9-12s9 5 9 12v5l-4 3h-10l-4-3z"/><path d="M10 17h12l-2 4h-8z" fill="currentColor" fill-opacity=".35"/></svg>',
  arms:'<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 27V15l2-6h3v6M14 15V7h3v8M17 15V8h3v8M20 16V10h3v9l-2 8z"/><path d="M9 21h12"/></svg>',
  chest:'<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M11 5l5 3 5-3 6 4-2 7-3-1v12H10V15l-3 1-2-7z"/><path d="M13 15h6M13 20h6"/></svg>',
  legs:'<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h14l1 8-3 14h-4l-1-11-1 11h-4L8 13z"/><path d="M9 9h14"/></svg>',
  class:'<svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h14v16l-7 6-7-6z"/><path d="M16 10l2.5 4-2.5 4-2.5-4z" fill="currentColor" fill-opacity=".45"/></svg>'
};

/* ================= STATE + SAVING ================= */
const LKEY = "vault.v1";
const local = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const cached = local.get(LKEY, {});
let marks = cached.marks || {};
let armor = cached.armor || {};
let armorLook = cached.armorLook || {};
const SOUND_URL = (() => { try{ return JSON.parse(document.getElementById("vault-sound").textContent); }catch(e){ return null; } })();
const LVOL = "vault.volume.v1";
const VOL = Object.assign({v:0.8, m:false}, local.get(LVOL, {}));
const saveVol = () => local.set(LVOL, VOL);

const S = {
  view:"weapons", vaultSub:"weapons",
  ammo:"all", arch:"all", q:"", sorts:[], filters:{}, fOpen:false,
  wStat:"all", vStat:"all",
  aq:"", aStat:"all", aTags:[], aSort:"sheet", vaq:"",
  open:{}, menuFor:null, edit:null
};

let docRef = null, soundRef = null, sync = "loading";
function setSync(s){
  sync = s;
  const map = {loading:["Loading","var(--faint)"],saved:["Synced","var(--god)"],saving:["Saving","var(--semi)"],local:["This device only","var(--faint)"],error:["Not saved","var(--t-d)"],signedout:["Not signed in","var(--faint)"],offline:["Offline","var(--t-d)"]};
  const [l,c] = map[s] || map.local;
  const el = document.getElementById("sync");
  el.style.setProperty("--c", c); el.querySelector(".label").textContent = l;
  el.title = s === "saved" ? "Your progress is saved to your account and follows you to other devices."
    : s === "local" ? "Account sync isn't available in this view, so progress is saved in this browser only."
    : s === "signedout" ? "Progress is saved in this browser only. Sign in with Google to save it to your account and use it on any device."
    : s === "offline" ? "Couldn't reach the sign in service. Progress is saved in this browser for now."
    : s === "error" ? "The last change didn't save to your account. It's kept in this browser and will retry on your next change." : "";
}
let writing = false, writeAgain = false;
async function persist(){
  local.set(LKEY, {marks, armor, armorLook});
  if(!docRef){ return; }
  if(writing){ writeAgain = true; return; }
  writing = true; setSync("saving");
  try{
    do{
      writeAgain = false;
      const body = {v:1, marks, armor, armorLook};
      try{ await docRef.set(body); }
      catch(e){
        if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); await docRef.set(body); }
        else throw e;
      }
    }while(writeAgain);
    setSync("saved");
  }catch(e){
    if(e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")){ docRef = null; setSync("local"); }
    else setSync("error");
  }finally{ writing = false; }
}
let unsubVault = null;
function attachStore(ref, sref){
  soundRef = sref;
  let first = true;
  unsubVault = ref.onSnapshot(snap => {
    if(writing || snap.metadata.hasPendingWrites) return;
    if(first){
      first = false; docRef = ref;
      if(!snap.exists){
        if(Object.keys(marks).length || Object.keys(armor).length || Object.keys(armorLook).length) persist(); else setSync("saved");
        return;
      }
    }
    if(!snap.exists) return;
    const data = snap.data() || {};
    marks = JSON.parse(JSON.stringify(data.marks || {}));
    armor = JSON.parse(JSON.stringify(data.armor || {}));
    armorLook = JSON.parse(JSON.stringify(data.armorLook || {}));
    local.set(LKEY, {marks, armor, armorLook});
    setSync("saved");
    if(overlay.hidden && menu.hidden) render();
  }, () => { docRef = null; setSync(FB_CONFIG ? "error" : "local"); });
}
async function initSync(){
  if(FB_CONFIG) return initFirebase(FB_CONFIG);
  try{
    if(!window.claude || !window.claude.use){ setSync("local"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user){ setSync("local"); return; }
    const uid = await user.id();
    if(!uid){ setSync("local"); return; }
    attachStore(db.doc("data/users/" + uid + "/vault"), db.doc("data/users/" + uid + "/sound"));
  }catch(e){ setSync("local"); }
}

/* ---------- website mode: Google sign in + Firestore (Firebase) ---------- */
const FB_CONFIG = (() => { try{ return JSON.parse(document.getElementById("vault-firebase").textContent); }catch(e){ return null; } })();
let fbAuth = null, fbUser = null, fbDb = null;
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
async function initFirebase(cfg){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    await loadScript(base + "firebase-app-compat.js");
    await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  }catch(e){ setSync("offline"); return; }
  firebase.initializeApp(cfg);
  fbAuth = firebase.auth(); fbDb = firebase.firestore();
  document.getElementById("acct").hidden = false;
  fbAuth.getRedirectResult().catch(()=>{});
  fbAuth.onAuthStateChanged(user => {
    if(unsubVault){ unsubVault(); unsubVault = null; }
    fbUser = user; docRef = null; soundRef = null;
    paintAcct();
    if(!user){ setSync("signedout"); return; }
    setSync("loading");
    attachStore(fbDb.doc("users/" + user.uid + "/data/vault"), fbDb.doc("users/" + user.uid + "/data/sound"));
  });
}
function paintAcct(){
  const b = document.getElementById("acct"); if(!b) return;
  const name = fbUser ? (fbUser.displayName || fbUser.email || "Account") : "";
  b.classList.toggle("in", !!fbUser);
  b.querySelector(".acct-av").textContent = fbUser ? name.trim().charAt(0).toUpperCase() : "";
  b.querySelector(".acct-l").textContent = fbUser ? name.split(" ")[0] : "Sign in";
  b.setAttribute("aria-label", fbUser ? `Signed in as ${name}. Account options` : "Sign in with Google");
}
function signIn(){
  const prov = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(prov).catch(e => {
    const c = e && e.code;
    if(c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/cancelled-popup-request") fbAuth.signInWithRedirect(prov);
    else if(c !== "auth/popup-closed-by-user") toast("Sign in didn't finish. Please try again.");
  });
}
function openAcctMenu(btn){
  S.menuFor = "acct";
  const name = fbUser.displayName || "", mail = fbUser.email || "";
  menu.innerHTML = `<div class="mh">${esc(name || mail)}${name && mail ? `<br>${esc(mail)}` : ""}</div>
    <button type="button" role="menuitem" data-act="export"><span style="color:var(--accent)">${I.check}</span>Export my progress</button>
    <button type="button" role="menuitem" data-act="import"><span style="color:var(--accent)">${I.plus}</span>Import progress</button>
    <div class="sep"></div>
    <button type="button" role="menuitem" data-act="signout"><span style="color:var(--muted)">${I.clear}</span>Sign out</button>`;
  placeMenu(btn);
}
function exportProgress(){
  const body = JSON.stringify({app:"endgame-api", v:1, exported:new Date().toISOString(), marks, armor, armorLook}, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type:"application/json"}));
  a.download = "endgame-api-progress.json"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Progress exported");
}
let pendingImport = null;
function importModal(data){
  pendingImport = data;
  const nw = Object.keys(data.marks||{}).length, na = Object.values(data.armor||{}).reduce((t,s)=>t+Object.keys(s).length,0), nl = Object.values(data.armorLook||{}).reduce((t,s)=>t+Object.keys(s).length,0);
  openModal(`<div class="modal-head"><h2>Import progress</h2>${closeX}</div>
    <div class="modal-body">
      <p>This file has <b>${nw}</b> marked weapons, <b>${na}</b> armor pieces and <b>${nl}</b> armor pieces on your Looking for list.</p>
      <p>Importing replaces the progress you have now${fbUser ? " and saves it to your account" : ""}.</p>
    </div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button type="button" class="btn primary" data-act="import-go" data-autofocus>Replace with this file</button></div>`);
}

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const elVar = e => `var(--el-${String(e).toLowerCase()})`;
const isObtained = m => m === "god" || m === "semi";
const piecesOf = s => armor[s.id] || {};
const lookOf = s => armorLook[s.id] || {};
const lookHave = s => PIECES.filter(([p]) => (lookOf(s)[p]||[]).filter(k => STATNAME[k]).length).length;
const lookTotal = () => SETS.reduce((a,s) => a + lookHave(s), 0);
const lookStats = () => SETS.reduce((a,s) => a + PIECES.reduce((b,[p]) => b + (lookOf(s)[p]||[]).filter(k => STATNAME[k]).length, 0), 0);
const validStats = arr => (arr||[]).filter(k => STATNAME[k]);
const piecesHave = s => PIECES.filter(([p]) => validStats(piecesOf(s)[p]).length).length;
const fn = n => n ? `<sup class="fn" title="${esc(NOTES[n] || "")}">[${n}]</sup>` : "";
function lines(arr){ return `<div class="lines">${arr.map(x => Array.isArray(x) ? `<s title="Struck on the sheet">${esc(x[0])}</s>` : `<span>${esc(x)}</span>`).join("")}</div>`; }
function thumb(w, big){
  const m = marks[w.id] || "";
  return `<div class="thumb ${m} ${big?"big":""}" data-thumb="${w.id}"><img src="${iconURL("w", w.id)}" alt="" decoding="async"></div>`;
}
const perkName = x => Array.isArray(x) ? x[0] : x;
function ico(kind, id, label, cls){
  const src = id ? iconURL(kind, id) : "";
  if(!src) return `<span class="ic txt ${cls||""}" tabindex="0" data-tip="${esc(label)}">${esc(label)}</span>`;
  return `<span class="ic ${cls||""}" tabindex="0" role="img" aria-label="${esc(label)}" data-tip="${esc(label)}"><img src="${src}" alt="" decoding="async"></span>`;
}
function elemCell(e){ return ico("e", String(e).toLowerCase(), e); }
function frameCell(w){ return w.frame ? ico("t", w.fi, w.frame + (w.frameNote ? ` [${w.frameNote}]` : ""), "frame") : '<span class="dim">—</span>'; }
function originCell(w){
  if(!w.origin || w.origin === "None") return '<span class="dim">—</span>';
  return ico("t", w.oi, w.origin + (w.oriX ? " (struck on the sheet)" : ""), w.oriX ? "x" : "");
}
function perkNamed(w, arr, rows){
  const cells = arr.map(x => { const n = perkName(x), struck = Array.isArray(x), id = (w.pi||{})[n];
    return `<div class="pn ${struck?"x":""}">${id?`<img src="${iconURL("t", id)}" alt="">`:""}<span>${struck?`<s>${esc(n)}</s>`:esc(n)}</span></div>`; });
  while(cells.length < rows) cells.push('<div class="pn"></div>');
  return `<div class="pcol">${cells.join("")}</div>`;
}
const PHONE = window.matchMedia ? matchMedia("(max-width: 700px)") : {matches:false};
function perkCol(w, arr, rows){
  const cells = arr.map(x => { const n = perkName(x), struck = Array.isArray(x);
    return `<div class="slot">${ico("t", (w.pi||{})[n], n + (struck ? " (struck on the sheet)" : ""), struck ? "x" : "")}</div>`; });
  while(cells.length < rows) cells.push('<div class="slot"></div>');
  return `<div class="pk">${cells.join("")}</div>`;
}
function stunImg(t, cls){ return STUN[t] ? `<span class="ic" tabindex="0" role="img" aria-label="${t}" data-tip="${t}"><img class="${cls||"stun"}" src="${STUN[t]}" alt=""></span>` : `<span class="dim">—</span>`; }
function statsCell(w){
  return `<div class="stats-cell">${w.stats.map(([k,v,c,n]) => `<span class="ammo ${c?"":"plain"}" style="--c:${c||"var(--panel-2)"}" title="${k}">${k!=="Ammo"?`<small>${k}</small>`:""}${esc(v)}${fn(n)}</span>`).join("")}</div>`;
}
function tierCell(t, rank){ return `<div class="tier-cell"><span class="tier" style="--c:${tierVar(t)}">${esc(t)}</span>${rank!=null?`<span class="rank">#${rank}</span>`:""}</div>`; }

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false"));
  const got = WEAPONS.filter(w => isObtained(marks[w.id])).length;
  $("#navCount").textContent = got ? got : "";
  let html = "";
  if(S.view === "weapons") html = weaponBrowser("all");
  if(S.view === "armor")   html = armorBlock("all");
  if(S.view === "vault")   html = vaultView();
  const strip = document.querySelector(".chips"), keep = strip ? strip.scrollLeft : 0;
  $("#main").innerHTML = html;
  const ns = document.querySelector(".chips");
  if(ns){ ns.scrollLeft = keep; }
  hideTip();
}

/* ---------- weapons ---------- */
function baseWeapons(mode){ return mode === "vault" ? WEAPONS.filter(w => marks[w.id]) : WEAPONS; }
function scope(mode){ return baseWeapons(mode).filter(w => (S.ammo === "all" || w.a === S.ammo) && (S.arch === "all" || w.arch === S.arch)); }
function weaponBrowser(mode){
  const base = baseWeapons(mode);
  const ammo = AMMO_TABS.find(a => a.key === S.ammo);

function matchStatus(w, st){

const ARCH_ORDER = Object.fromEntries(AMMO.flatMap(a => a.archs).map((x,i) => [x,i]));
function sortList(list){
  return list.slice().sort((a,b) => {
    for(const s of S.sorts){
      let c;
      if(s.key === "tier") c = (TIER_ORDER[a.tier] ?? 9) - (TIER_ORDER[b.tier] ?? 9) || a.rank - b.rank;
      else if(s.key === "ammo") c = b.ammo - a.ammo;
      else if(s.key === "season") c = (+b.season) - (+a.season);
      else if(s.key === "p1" || s.key === "p2") c = flat(a[s.key]).localeCompare(flat(b[s.key]));
      else c = String(a[s.key]).localeCompare(String(b[s.key]));

}
function weaponList(mode){

/* ================= FX ================= */
let actx = null;
function chime(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const s = t + i*0.075;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.16*VOL.v), s+0.015); g.gain.exponentialRampToValueAtTime(0.0001, s+0.7);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+0.75);
    });
  }catch(e){}
}
function playGodSound(){
  if(VOL.m || VOL.v === 0) return;
  if(SOUND_URL){ try{ const a = new Audio(SOUND_URL); a.volume = Math.min(1, VOL.v); a.play().catch(chime); return; }catch(e){} }
  chime();
}
const cv = $("#confetti"); let parts = [], raf = 0;
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n, angle, spread, speed){
  const cols = ["#3fdc86","#a8f5c8","#f3c64a","#ffffff","#9cc6e4","#2bb86c"];
  for(let i=0;i<n;i++){
    const a = angle + (Math.random()-.5)*spread, sp = speed*(0.55+Math.random()*0.7);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*0.35,c:cols[i%cols.length],t:0,ttl:110+Math.random()*70});
  }
  if(!raf){ cv.hidden = false; raf = requestAnimationFrame(tick); }
}
function tick(){
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  parts = parts.filter(p => p.t < p.ttl && p.y < H + 30);
  for(const p of parts){
    p.t++; p.vx *= 0.986; p.vy = p.vy*0.986 + 0.28; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    const flip = Math.abs(Math.cos(p.r*1.7));
    ctx.globalAlpha = Math.max(0, 1 - p.t/p.ttl);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h*flip/2, p.w, p.h*flip + 0.6);
    ctx.restore();
  }
  if(parts.length){ raf = requestAnimationFrame(tick); } else { raf = 0; ctx.clearRect(0,0,W,H); cv.hidden = true; }
}
function celebrate(id){
  playGodSound();
  const el = document.querySelector(`[data-thumb="${id}"]`);
  if(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  if(reduceMotion()) return;
  let x = innerWidth/2, y = innerHeight/2;
  if(el){ const r = el.getBoundingClientRect(); if(r.bottom > 0 && r.top < innerHeight){ x = r.left + r.width/2; y = r.top + r.height/2; } }
  burst(x, y, 90, -Math.PI/2, Math.PI*1.3, 13);
  burst(0, innerHeight, 70, -Math.PI/3, 0.6, 22);
  burst(innerWidth, innerHeight, 70, -Math.PI*2/3, 0.6, 22);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t || !t.closest("#menu")){ if(!(t && (t.dataset.act === "status" || t.dataset.act === "piece" || t.dataset.act === "acct" || t.dataset.act === "sound"))) closeMenu(); }
  if(!t) return;
  const a = t.dataset.act, k = t.dataset.k, id = t.dataset.id;
  switch(a){
    case "noop": return;
    case "overlay": case "modal-close": closeModal(); return;
    case "nav": S.view = t.dataset.view; S.aStat = "all"; if(location.hash !== "#"+S.view) location.hash = S.view; render(); scrollTo({top:0}); return;
    case "ammo": { const st = stuck(); S.ammo = k; S.arch = "all"; render(); const c = document.querySelector(".chips"); if(c) c.scrollLeft = 0; if(st) toCatbar(); return; }
    case "arch": { const st = stuck(); S.arch = k; render(); if(st) toCatbar(); return; }
    case "sort": {
      const i = S.sorts.findIndex(s => s.key === k);
      if(i < 0) S.sorts.push({key:k, dir:1}); else S.sorts[i].dir *= -1;
      render(); return; }
    case "sort-x": S.sorts = S.sorts.filter(s => s.key !== k); render(); return;
    case "sort-clear": S.sorts = []; render(); return;
    case "filt": {
      const f = t.dataset.f, v = t.dataset.v, cur = S.filters[f] || [];
      S.filters[f] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v);
      render(); return; }
    case "filt-clear": e.preventDefault(); S.filters = {}; render(); return;
    case "stat": if(t.dataset.mode === "vault") S.vStat = k; else S.wStat = k; render(); return;
    case "astat": S.aStat = k; render(); return;
    case "asort": S.aSort = k; render(); return;
    case "atag": S.aTags = S.aTags.includes(k) ? S.aTags.filter(x => x !== k) : S.aTags.concat(k); render(); return;
    case "atag-clear": S.aTags = []; render(); return;
    case "vsub": S.vaultSub = k; S.aStat = "all"; render(); return;
    case "open": S.open[id] = !S.open[id]; refreshList(); return;
    case "status":
      if(S.menuFor === id && !menu.hidden){ closeMenu(); return; }
      openMenu(t, id); return;
    case "m-obtained": closeMenu(); weaponModal(id); return;
    case "m-looking": closeMenu(); marks[id] = "looking"; persist(); render(); toast(`${BYID[id].name} added to Looking for`); return;
    case "m-clear": closeMenu(); delete marks[id]; persist(); render(); toast(`Cleared ${BYID[id].name}`); return;
    case "roll":
      marks[id] = k; persist(); closeModal(); render();
      if(k === "god"){ requestAnimationFrame(() => celebrate(id)); toast(`${BYID[id].name} logged as a God Roll`); }
      else { requestAnimationFrame(() => { const el = document.querySelector(`[data-thumb="${id}"]`); if(el) el.classList.add("pop"); }); toast(`${BYID[id].name} logged as a Semi-God Roll`); }
      return;
    case "piece": {
      const key = "set:" + t.dataset.set + ":" + t.dataset.piece;
      if(S.menuFor === key && !menu.hidden){ closeMenu(); return; }
      openArmorMenu(t, t.dataset.set, t.dataset.piece); return; }
    case "am-have": closeMenu(); armorModal(t.dataset.set, t.dataset.piece, "have"); return;
    case "am-want": closeMenu(); armorModal(t.dataset.set, t.dataset.piece, "want"); return;
    case "am-clear": {
      closeMenu(); const sid = t.dataset.set, pc = t.dataset.piece;
      for(const store of [armor, armorLook]){ if(store[sid]){ delete store[sid][pc]; if(!Object.keys(store[sid]).length) delete store[sid]; } }
      persist(); render(); toast(`Cleared ${SETBY[sid].name} ${PIECES.find(p=>p[0]===pc)[1].toLowerCase()}`); return; }
    case "stat-t": { const sel = S.edit.sel; sel.has(k) ? sel.delete(k) : sel.add(k); t.setAttribute("aria-pressed", sel.has(k)); return; }
    case "armor-save": {
      const {setId, piece, sel, mode} = S.edit;
      const ordered = STATS.map(s => s[0]).filter(x => sel.has(x));
      const store = mode === "want" ? armorLook : armor;
      store[setId] = store[setId] || {};
      if(ordered.length) store[setId][piece] = ordered; else delete store[setId][piece];
      if(!Object.keys(store[setId]).length) delete store[setId];
      let found = 0;
      if(mode !== "want" && armorLook[setId] && armorLook[setId][piece]){
        const before = armorLook[setId][piece];
        const left = before.filter(k => !sel.has(k)); found = before.length - left.length;
        if(left.length) armorLook[setId][piece] = left; else delete armorLook[setId][piece];
        if(!Object.keys(armorLook[setId]).length) delete armorLook[setId];
      }
      persist(); closeModal(); render();
      if(found) toast(`Found ${found === 1 ? "a stat type" : found + " stat types"} you were looking for. Removed from Looking for.`);
      return; }
    case "armor-clear": {
      const {setId, piece, mode} = S.edit;
      const store = mode === "want" ? armorLook : armor;
      if(store[setId]){ delete store[setId][piece]; if(!Object.keys(store[setId]).length) delete store[setId]; }
      persist(); closeModal(); render(); return; }
    case "sound":
      if(S.menuFor === "sound" && !menu.hidden){ closeMenu(); return; }

document.addEventListener("change", e => {
  if(e.target.id === "importFile"){
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
    f.text().then(txt => {
      let d; try{ d = JSON.parse(txt); }catch(err){ d = null; }
      if(!d || typeof d !== "object" || !(d.marks || d.armor || d.armorLook)){ toast("That file isn't an Endgame API progress export."); return; }
      importModal(d);
    });
    return;
  }
});
document.addEventListener("toggle", e => { if(e.target.classList && e.target.classList.contains("filters")) S.fOpen = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(!menu.hidden){ closeMenu(); return; } if(!overlay.hidden) closeModal(); }
});
addEventListener("scroll", closeMenu, {passive:true});
addEventListener("resize", closeMenu);
/* hover labels for icons */
const tip = document.getElementById("tip"); let tipFor = null;
function showTip(el){
  const text = el.getAttribute("data-tip"); if(!text) return;
  tipFor = el; tip.textContent = text; tip.hidden = false; tip.classList.remove("below");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width/2 - tw/2; left = Math.max(8, Math.min(left, innerWidth - tw - 8));
  let top = r.top - th - 8;
  if(top < 8){ top = r.bottom + 8; tip.classList.add("below"); }
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tip.style.setProperty("--ax", (r.left + r.width/2 - left) + "px");
}
function hideTip(){ tip.hidden = true; tipFor = null; }
document.addEventListener("pointerover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el && el !== tipFor) showTip(el); else if(!el && tipFor) hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if(el) showTip(el); });
document.addEventListener("focusout", e => { if(e.target === tipFor) hideTip(); });
addEventListener("scroll", hideTip, {passive:true, capture:true});

/* keep the category bar pinned right under the top bar */
const topbar = document.querySelector(".topbar");
function setHdr(){ document.documentElement.style.setProperty("--hdr", topbar.offsetHeight + "px"); }
try{ new ResizeObserver(setHdr).observe(topbar); }catch(err){ addEventListener("resize", setHdr); }
setHdr();
function catTop(){ const s = document.querySelector(".cat-sentinel"); return s ? s.getBoundingClientRect().top + scrollY - topbar.offsetHeight : 0; }
function stuck(){ return document.querySelector(".cat-sentinel") && scrollY > catTop() + 2; }
function toCatbar(){ scrollTo({top: Math.max(0, catTop())}); }
/* mouse wheel scrolls the archetype strip sideways */
document.addEventListener("wheel", e => {
  const c = e.target.closest && e.target.closest(".chips");
  if(!c || c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  e.preventDefault(); c.scrollLeft += e.deltaY;
}, {passive:false});

try{ PHONE.addEventListener("change", () => render()); }catch(err){}
function fromHash(){ const h = location.hash.replace("#",""); if(["weapons","armor","vault"].includes(h)) S.view = h; render(); }
addEventListener("hashchange", fromHash);
setSync("loading");
paintVol();
fromHash();
initSync();
})();
</script>
